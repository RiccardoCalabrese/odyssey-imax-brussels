<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey · IMAX 70mm · Brussels</title>
<meta name="description" content="Verified seat availability for The Odyssey in IMAX 2D 70MM at Kinepolis Brussels.">
<meta property="og:title" content="Odyssey · IMAX 70mm · Brussels">
<meta property="og:description" content="Which screenings actually have seats — checked against the real booking system.">
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --ink:#14131a; --muted:#6b6875; --line:#e8e5e0;
  --ok:#0f7a4d; --ok-bg:#e8f5ee; --warn:#8a5a00; --warn-bg:#fdf4e3; --dim:#a8a4b0;
  --accent:#14131a; --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0e0d12; --panel:#17161d; --ink:#f2f0f5; --muted:#9a96a6; --line:#26242e;
         --ok:#4ade80; --ok-bg:#12291d; --warn:#fbbf24; --warn-bg:#2a2010; --dim:#514d5c;
         --accent:#f2f0f5; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding:32px 20px 64px}
.wrap{max-width:640px;margin:0 auto}
header{margin-bottom:22px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0}
.sub b{color:var(--ink);font-weight:600}

.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin:16px 0;
  background:var(--warn-bg);color:var(--warn);border:1px solid transparent}
.banner b{display:block;margin-bottom:2px}

.controls{margin:22px 0 6px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-weight:600;font-size:15px;padding:9px 4px;border-radius:8px;cursor:pointer;
  transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}

.summary{margin:18px 0 12px;font-size:15px;color:var(--muted)}
.summary b{color:var(--ink)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:26px 0 10px;font-weight:600}

.toggle{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.toggle span{user-select:none}
.seats-line{color:var(--muted);font-size:13px;margin-top:2px}

/* calendar */
.month{margin-top:22px}
.month h3{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px;color:var(--ink)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow div{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  text-align:center;padding-bottom:5px}
.cell{min-height:62px;border:1px solid var(--line);border-radius:9px;padding:4px 3px 5px;
  background:var(--panel);display:flex;flex-direction:column;gap:2px}
.cell.blank{border-color:transparent;background:transparent;min-height:0}
.cell.none{opacity:.45}
.cell.hit{border-color:var(--ok)}
.dnum{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3}
.cell.hit .dnum{color:var(--ink);font-weight:700}
.chip{display:block;text-align:center;font-size:10px;line-height:1.5;padding:1px 2px;
  border-radius:4px;text-decoration:none;white-space:nowrap}
.chip.match{background:var(--ok-bg);color:var(--ok);font-weight:700}
.chip.other{color:var(--dim)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.legend i.m{background:var(--ok)} .legend i.o{background:var(--dim)}
.best h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:26px 0 10px;font-weight:600}
@media(max-width:420px){
  .dow,.grid{gap:3px}
  .cell{min-height:54px;padding:3px 1px 4px;border-radius:7px}
  .chip{font-size:9px;padding:1px 1px}
  .dnum{font-size:9.5px}
}
.where{font-size:12.5px;color:var(--ok);margin-top:4px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
li{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:14px}
li.fits{border-color:var(--ok)}
.when{flex:1;min-width:0}
.day{font-weight:650;font-size:16px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.state{text-align:right;flex-shrink:0}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:5px 10px;border-radius:999px;
  background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.pill.hint{background:var(--warn-bg);color:var(--warn)}
.pill.no{background:transparent;color:var(--dim);border:1px solid var(--line)}
.book{display:inline-block;margin-top:7px;font-size:13px;font-weight:650;color:var(--bg);
  background:var(--accent);text-decoration:none;padding:7px 13px;border-radius:8px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
  padding:28px 20px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
footer{margin-top:26px;color:var(--muted);font-size:12.5px;line-height:1.65;
  border-top:1px solid var(--line);padding-top:16px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.bad{background:var(--warn)}
@media(max-width:420px){
  body{padding:24px 14px 48px} h1{font-size:22px}
  li{padding:13px 14px;gap:10px} .seg button{font-size:14px;padding:9px 2px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">The Odyssey · IMAX 70mm</h1>
    <p class="sub" id="subtitle"><b>Kinepolis Brussel</b> · IMAX 2D 70MM · Version Anglaise</p>
  </header>

  <div id="trust"></div>

  <div class="controls">
    <div class="label">Seats together</div>
    <div class="seg" id="seg" role="group" aria-label="Group size"></div>
    <label class="toggle"><input type="checkbox" id="centreOnly"><span>Centre of the theatre only</span></label>
    <label class="toggle"><input type="checkbox" id="weekendOnly"><span>Weekend only (Fri from 18:00, Sat &amp; Sun)</span></label>
  </div>

  <p class="summary" id="summary">Loading…</p>
  <div id="cal"></div>
  <div id="best"></div>

  <div id="live"></div>
  <footer id="foot"></footer>
</div>

<script>
const OPTS=[{k:'any',t:'Any'},{k:2,t:'2'},{k:4,t:'4'},{k:6,t:'6'},{k:8,t:'8'}];
let party='any', data=null, liveNote=null;

const seg=document.getElementById('seg');
OPTS.forEach(o=>{
  const b=document.createElement('button');
  b.textContent=o.t; b.dataset.k=o.k; b.setAttribute('aria-pressed',o.k===party);
  b.onclick=()=>{party=(o.k==='any'?'any':Number(o.k));
    [...seg.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.k==String(o.k)));
    render();};
  seg.appendChild(b);
});

document.getElementById('centreOnly').addEventListener('change',()=>render());
document.getElementById('weekendOnly').addEventListener('change',()=>render());

// Weekend = Friday evening through the end of Sunday.
const isWeekend=s=>{
  const mins=(()=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s.time||'');return m?(+m[1])*60+(+m[2]):0;})();
  if(s.day==='Sat'||s.day==='Sun') return true;
  if(s.day==='Fri') return mins>=18*60;
  return false;
};
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return'just now'; if(m<60)return m+' min ago';
  const h=Math.round(m/60); if(h<24)return h+(h==1?' hour ago':' hours ago');
  return Math.round(h/24)+' days ago';};

const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Jul:6,Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11};
const MNAME=['January','February','March','April','May','June','July','August','September','October','November','December'];
// isoDate arrives as 2026-Sept-25 (or 2026-09-25 from newer runs) - accept both.
function dayOf(s){
  const m=/^(\d{4})-([A-Za-z]+|\d{1,2})-(\d{1,2})$/.exec(s.isoDate||'');
  if(!m) return null;
  const mo=isNaN(+m[2])?MONTHS[m[2]]:(+m[2]-1);
  if(mo==null) return null;
  return new Date(Date.UTC(+m[1],mo,+m[3]));
}
const key=d=>d.toISOString().slice(0,10);

function render(){
  const cal=document.getElementById('cal'), best=document.getElementById('best');
  const sum=document.getElementById('summary');
  const centre=document.getElementById('centreOnly').checked;
  const weekend=document.getElementById('weekendOnly').checked;
  const need=party==='any'?1:party;

  // Only screenings the booking system actually offered seats for.
  const withSeats=data.shows.filter(s=>s.status==='open'&&s.seatsFree>0);
  const passes=s=>(!weekend||isWeekend(s))
    && (centre ? (s.goldenMaxBlock||0)>=Math.max(need,2) : (s.maxBlock||0)>=need);
  const shown=withSeats.filter(passes);

  const what = centre
    ? `<b>${need>1?need:2}</b> together in the centre`
    : (party==='any' ? 'seats' : `<b>${party}</b> together`);
  sum.innerHTML = shown.length
    ? `<b>${shown.length}</b> ${weekend?'weekend ':''}screening${shown.length===1?'':'s'} with ${what} · of ${data.counts.checked} checked.`
    : `No ${weekend?'weekend ':''}screening has ${what} right now · ${data.counts.checked} checked.`;

  // Bucket every screening-with-seats by calendar day.
  const byDay=new Map();
  let lo=null, hi=null;
  for(const s of withSeats){
    const d=dayOf(s); if(!d) continue;
    if(!lo||d<lo) lo=d; if(!hi||d>hi) hi=d;
    const k=key(d); if(!byDay.has(k)) byDay.set(k,[]);
    byDay.get(k).push({s,match:passes(s)});
  }
  cal.innerHTML=''; best.innerHTML='';
  if(!lo){
    cal.innerHTML=`<div class="empty"><b>Nothing available right now</b>`
      +`Checked against the real booking system ${ago(data.updated)}. This page updates automatically.</div>`;
    return;
  }

  // One grid per month, Monday-first.
  const cur=new Date(Date.UTC(lo.getUTCFullYear(),lo.getUTCMonth(),1));
  const end=new Date(Date.UTC(hi.getUTCFullYear(),hi.getUTCMonth(),1));
  while(cur<=end){
    const y=cur.getUTCFullYear(), mo=cur.getUTCMonth();
    const first=new Date(Date.UTC(y,mo,1)), days=new Date(Date.UTC(y,mo+1,0)).getUTCDate();
    const lead=(first.getUTCDay()+6)%7;   // Monday = 0
    const wrap=document.createElement('div'); wrap.className='month';
    let html=`<h3>${MNAME[mo]} ${y}</h3><div class="dow">`
      +['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')+`</div><div class="grid">`;
    for(let i=0;i<lead;i++) html+=`<div class="cell blank"></div>`;
    for(let d=1;d<=days;d++){
      const k=key(new Date(Date.UTC(y,mo,d)));
      const list=(byDay.get(k)||[]).sort((a,b)=>a.s.time<b.s.time?-1:1);
      const hits=list.filter(x=>x.match);
      const cls=hits.length?'cell hit':(list.length?'cell':'cell none');
      html+=`<div class="${cls}"><div class="dnum">${d}</div>`;
      for(const {s,match} of list){
        const label=match&&centre?`${s.time}`:s.time;
        const tip=match
          ? `${s.seatsFree} seats free · ${centre?s.goldenMaxBlock+' together in the centre':s.maxBlock+' together'}`
          : `${s.seatsFree} seats free · doesn't match the filter`;
        html+=`<a class="chip ${match?'match':'other'}" href="${s.bookUrl}" target="_blank" rel="noopener" title="${tip}">${label}</a>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
    wrap.innerHTML=html; cal.appendChild(wrap);
    cur.setUTCMonth(cur.getUTCMonth()+1);
  }
  const leg=document.createElement('div'); leg.className='legend';
  leg.innerHTML=`<span><i class="m"></i>matches your filters</span><span><i class="o"></i>has seats, doesn’t match</span>`;
  cal.appendChild(leg);

  // The detail the calendar can't show: exactly which seats.
  if(shown.length){
    const rank=[...shown].sort((a,b)=>
      (centre?b.goldenMaxBlock-a.goldenMaxBlock:b.maxBlock-a.maxBlock) || (a.isoDate<b.isoDate?-1:1));
    let h='<h3>Best options</h3><ul>';
    for(const s of rank.slice(0,5)){
      const runs=(s.goldenRuns||[]).filter(r=>r.size>=Math.max(need,2)).slice(0,2);
      const where=centre&&runs.length
        ? `<div class="where">${runs.map(r=>`Row ${r.row}, seats ${r.seats[0]}–${r.seats[r.seats.length-1]}`).join(' · ')}</div>`:'';
      h+=`<li><div class="when">
            <div class="day">${s.day} ${s.date} · ${s.time}</div>
            <div class="seats-line">${s.seatsFree} seat${s.seatsFree===1?'':'s'} available${s.goldenFree?` · ${s.goldenFree} in the centre`:''}</div>
            ${where}
          </div>
          <div class="state"><span class="pill">${centre?s.goldenMaxBlock+' together in centre':s.maxBlock+' together'}</span><br>
          <a class="book" href="${s.bookUrl}" target="_blank" rel="noopener">Book</a></div></li>`;
    }
    best.className='best'; best.innerHTML=h+'</ul>';
  }
}

function renderTrust(){
  const el=document.getElementById('trust');
  if(data.verified){el.innerHTML='';return;}
  el.innerHTML=`<div class="banner"><b>⚠ This check could not verify itself</b>
    The scraper failed its own control test, so “sold out” may just mean it broke.
    Treat everything below as unreliable until the next run.</div>`;
}

function renderLive(){
  const el=document.getElementById('live');
  if(!liveNote){el.innerHTML='';return;}
  const {added,maybe}=liveNote;
  if(!added.length&&!maybe.length){el.innerHTML='';return;}
  let h='<h2>Unconfirmed — since the last full check</h2><ul>';
  for(const s of added) h+=`<li><div class="when"><div class="day">${s.day} ${s.date} · ${s.time}</div>
    <div class="meta">Newly added screening — not seat-checked yet</div></div>
    <div class="state"><span class="pill hint">New</span><br>
    <a class="book" href="${s.bookUrl}" target="_blank" rel="noopener">Check</a></div></li>`;
  for(const s of maybe) h+=`<li><div class="when"><div class="day">${s.day} ${s.date} · ${s.time}</div>
    <div class="meta">Kinepolis no longer flags this as sold out</div></div>
    <div class="state"><span class="pill hint">Maybe</span><br>
    <a class="book" href="${s.bookUrl}" target="_blank" rel="noopener">Check</a></div></li>`;
  el.innerHTML=h+'</ul><p class="summary" style="font-size:13px">Just added to the schedule — seats not checked yet. The next automatic run confirms them.</p>';
}

function foot(){
  const v=data.verified
    ? `<span class="dot"></span>Verified: the scraper proved it can still detect free seats (control showed ${data.verification.controlSeatsFree} seats).`
    : `<span class="dot bad"></span>Not verified this run.`;
  const errs = data.counts.errors
    ? `<br><span class="dot bad"></span>${data.counts.errors} screening${data.counts.errors===1?'':'s'} could not be checked this run — ${data.counts.errors===1?'it is':'they are'} not listed above.`
    : '';
  document.getElementById('foot').innerHTML=
    `${v}${errs}<br>Seat counts read from the real Kinepolis booking system ${ago(data.updated)}, `
    + `rechecked automatically every hour.<br>`
    + `“Together” means consecutive seats in one row, with aisles breaking the run.<br>`
    + `“Centre” = the middle seating block only (never the side blocks), its middle `
    + `${Math.round((data.golden.widthFrac||0.5)*100)}% of width, rows `
    + `${Math.round((data.golden.depthFrom||0.33)*100)}%–${Math.round((data.golden.depthTo||0.67)*100)}% of the way back.`;
}

// Live check: the showtime list is readable straight from the browser, so we can spot
// changes since the last full scrape. It carries no seat counts, only Kinepolis'
// unreliable sold-out flag — so anything it finds is shown as a hint, never as fact.
async function liveCheck(){
  try{
    const r=await fetch(`https://kinepolisweb-programmation.kinepolis.com/api/Sessions/BE/FR/${data.movieId}/WWW/Cinema/KinepolisBelgium`);
    if(!r.ok)return;
    const all=await r.json();
    const BRU=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Brussels',weekday:'short',
      day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
    const fmt=iso=>{const o=BRU.formatToParts(new Date(iso)).reduce((a,x)=>(a[x.type]=x.value,a),{});
      return {day:o.weekday,date:`${o.day} ${o.month.slice(0,3)}`,time:`${o.hour}:${o.minute}`};};
    const now=Date.now();
    const live=all.filter(s=>s.mainComplex===data.complex
      &&s.film&&s.film.format&&s.film.format.name===data.format
      &&s.film.data&&s.film.data.spokenLanguage&&s.film.data.spokenLanguage.name===data.version
      &&new Date(s.showtime).getTime()>now);
    const known=new Map(data.shows.map(s=>[s.vistaSessionId,s]));
    const added=[],maybe=[];
    for(const s of live){
      const mk=()=>({...fmt(s.showtime),bookUrl:`https://web.kinepolis.be/fr-fr/order/showtimes/${data.complex}-${s.vistaSessionId}/seats`});
      const k=known.get(s.vistaSessionId);
      // Only newly-added screenings. We deliberately ignore Kinepolis' isSoldOut flag:
      // it was wrong for 41% of screenings, always claiming seats that don't exist.
      if(!k) added.push(mk());
    }
    liveNote={added:added.slice(0,12), maybe:[]}; renderLive();
  }catch(e){/* offline or blocked - the page still works from data.json */}
}

fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  data=d;
  document.getElementById('title').textContent=`${d.movie} · ${d.format}`;
  document.getElementById('subtitle').innerHTML=`<b>${d.cinema}</b> · ${d.version}`;
  document.title=`${d.movie} · ${d.format}`;
  renderTrust(); render(); foot(); liveCheck();
}).catch(()=>{
  document.getElementById('summary').textContent='';
  document.getElementById('cal').innerHTML='<div class="empty"><b>Could not load data</b>Try refreshing in a moment.</div>';
});
</script>
</body>
</html>
