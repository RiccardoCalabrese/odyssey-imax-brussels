name: Refresh seat availability

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Optional vistaSessionId to self-test the "open" path instead of a full run'
        required: false
        default: ''
      test_alert:
        description: 'Send a test Telegram message and stop (no scrape)'
        type: boolean
        default: false
  schedule:
    # Hourly. Each run walks the booking flow for every tracked screening,
    # so don't make this much more frequent - see README on being a good citizen.
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The copy that is currently published - what we diff against to find what's NEW.
      - name: Keep the previous results
        if: inputs.probe == '' && !inputs.test_alert
        run: cp data.json prev.json || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send a test Telegram message
        if: inputs.test_alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT }}
          KIN_ALERT_SEATS: '2'
          KIN_ALERT_CENTRE: 'true'
        run: |
          node -e "const t=process.env.TELEGRAM_TOKEN||'';console.log('token present:',!!t,'| length:',t.length,'| looks like a bot token:',/^\\d+:[\\w-]{30,}$/.test(t.trim()))"
          node notify.mjs --test

      - run: google-chrome --version
        if: '!inputs.test_alert'

      # Self-test mode: prove the "open" path still works, without touching data.json.
      - name: Probe one session
        if: inputs.probe != '' && !inputs.test_alert
        run: node scrape.mjs --probe "${{ inputs.probe }}"

      - name: Scrape seat availability
        if: inputs.probe == '' && !inputs.test_alert
        run: node scrape.mjs

      # Runs before publishing so a Telegram outage can never block the site update.
      - name: Telegram alert for newly available seats
        if: inputs.probe == '' && !inputs.test_alert
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT:  ${{ secrets.TELEGRAM_CHAT }}
          KIN_ALERT_SEATS: '2'
          KIN_ALERT_CENTRE: 'true'
        run: node notify.mjs

      - name: Publish if changed
        if: inputs.probe == '' && !inputs.test_alert
        run: |
          # data.json is generated output. Merging it is never correct - a rebase
          # conflict here is what once wrote conflict markers into the published file.
          # So we never merge: we rebuild the commit on top of whatever remote has.
          cp data.json /tmp/fresh.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/fresh.json data.json
            if git diff --quiet data.json; then echo "No change."; exit 0; fi
            git add data.json
            git commit -q -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q origin HEAD:main; then echo "Published."; exit 0; fi
            echo "Push rejected; rebuilding on top of remote (attempt $i)…"
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1

      - name: Verify published JSON is parseable
        if: inputs.probe == '' && !inputs.test_alert
        run: node -e "const d=require('./data.json');if(!d.shows)throw new Error('bad data.json');console.log('data.json OK:',JSON.stringify(d.counts))"
