name: Refresh seat availability

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Optional vistaSessionId to self-test the "open" path instead of a full run'
        required: false
        default: ''
  schedule:
    # Hourly. Each run walks the booking flow for every tracked screening,
    # so don't make this much more frequent - see README on being a good citizen.
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: google-chrome --version

      # Self-test mode: prove the "open" path still works, without touching data.json.
      - name: Probe one session
        if: inputs.probe != ''
        run: node scrape.mjs --probe "${{ inputs.probe }}"

      - name: Scrape seat availability
        if: inputs.probe == ''
        run: node scrape.mjs

      - name: Publish if changed
        if: inputs.probe == ''
        run: |
          if git diff --quiet data.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Someone (a manual refresh.sh run, or an overlapping job) may have pushed
          # meanwhile. Rebase onto whatever is there and retry a few times.
          for i in 1 2 3; do
            if git push; then echo "Published."; exit 0; fi
            echo "Push rejected, rebasing (attempt $i)…"
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
