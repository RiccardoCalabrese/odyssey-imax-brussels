name: Refresh seat availability

on:
  workflow_dispatch:        # run it by hand from the Actions tab
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes (GitHub may delay this on free runners)

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show Chrome version
        run: google-chrome --version

      - name: Scrape seat availability
        run: node scrape.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then
            echo "No change."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Published."
          fi
